<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextDesk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 font-sans h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col justify-center shadow-sm">
        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">ContextDesk</h1>
        <p class="text-xs text-slate-500 font-medium mt-0.5">
            AI Workspace Assistant <span class="text-indigo-600 font-semibold">• Powered by Model Context Protocol (MCP)</span>
        </p>
    </header>

    <!-- Chat Messages Scroll Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 max-w-4xl mx-auto w-full">
        <!-- Messages will be dynamically rendered here -->
        
        <!-- Welcome Message -->
        <div class="flex items-start gap-3 max-w-[85%]">
            <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm flex-shrink-0 shadow-sm">
                CD
            </div>
            <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm">
                <p class="text-sm leading-relaxed">
                    Hello! I'm your ContextDesk workspace assistant. I can help with general queries, perform arithmetic calculations, or provide information about this project.
                </p>
                <div class="mt-3 flex flex-wrap gap-2">
                    <button class="quick-suggestion text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-1.5 px-3 rounded-full transition-colors">
                        What time is it?
                    </button>
                    <button class="quick-suggestion text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-1.5 px-3 rounded-full transition-colors">
                        Calculate 45 * 89
                    </button>
                    <button class="quick-suggestion text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-1.5 px-3 rounded-full transition-colors">
                        Tell me about this project
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Typing / Status Indicator -->
    <div id="loading-indicator" class="hidden max-w-4xl mx-auto w-full px-4 py-2 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-sm flex-shrink-0 animate-pulse"></div>
        <div class="bg-slate-100 text-slate-500 rounded-2xl rounded-tl-none px-4 py-2.5 flex items-center gap-1 shadow-sm">
            <span class="text-xs font-medium">ContextDesk is thinking</span>
            <span class="flex gap-1 items-center ml-1">
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></span>
            </span>
        </div>
    </div>

    <!-- Input Footer Sticky Section -->
    <footer class="bg-white border-t border-slate-200 px-4 py-4 w-full flex-shrink-0">
        <div class="max-w-4xl mx-auto">
            <form id="chat-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Type a message..." 
                    autocomplete="off"
                    class="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner bg-slate-50 focus:bg-white"
                >
                <button 
                    type="submit" 
                    id="send-button"
                    class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium px-5 py-3 rounded-xl text-sm transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-1 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span>Send</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>
        </div>
    </footer>

    <!-- JS Logic Script -->
    <script src="js/chat_logic.js?v=2"></script>
</body>
</html>
